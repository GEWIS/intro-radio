user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;
  server {
    listen       80;
    server_name  localhost;
    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
      # No explicit Cache-Control means browsers fall back to heuristic
      # caching (freshness guessed from Last-Modified), which can silently
      # serve a stale index.html -- pointing at deleted, no-longer-existing
      # JS/CSS asset files -- for a while after a redeploy. index.html is
      # tiny and ETag-backed, so always revalidating costs nothing.
      add_header Cache-Control "no-cache";
    }

    # Vite content-hashes these filenames, so a new build never reuses an old
    # asset's URL for different content -- caching them forever is safe, and
    # is what actually makes the no-cache rule above meaningful: this is the
    # only place staleness could hide once index.html itself always revalidates.
    location /assets/ {
      root   /app;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
