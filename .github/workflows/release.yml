name: Release

on:
  push:
    branches:
      - main

jobs:
  versioning:
    uses: GEWIS/actions/.github/workflows/versioning.yml@v1
    with:
      node-version: "22.x"

  release-frontend:
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    uses: GEWIS/actions/.github/workflows/docker-release-ghcr.yml@v1.17.0
    with:
      projects: '["frontend"]'
      dockerfiles: '["frontend/Dockerfile"]'
      version: ${{ needs.versioning.outputs.next-version }}
      docker-paths: '["gewis/intro-radio/frontend"]'
      # Baked into the built JS bundle -- see frontend/Dockerfile and
      # src/components/AppFooter.vue -- so the deployed page can show
      # exactly which commit and release version is running.
      build-args: |
        GIT_SHA=${{ github.sha }}
        APP_VERSION=v${{ needs.versioning.outputs.next-version }}

  release-nginx:
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    uses: GEWIS/actions/.github/workflows/docker-release-ghcr.yml@v1.17.0
    with:
      projects: '["frontend/nginx"]'
      dockerfiles: '["frontend/nginx/Dockerfile"]'
      version: ${{ needs.versioning.outputs.next-version }}
      docker-paths: '["gewis/intro-radio/nginx"]'

  release-backend:
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    uses: GEWIS/actions/.github/workflows/docker-release-ghcr.yml@v1.17.0
    with:
      projects: '["backend"]'
      dockerfiles: '["backend/Dockerfile"]'
      version: ${{ needs.versioning.outputs.next-version }}
      docker-paths: '["gewis/intro-radio/backend"]'
