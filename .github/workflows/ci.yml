name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This job never path-filters at the trigger level, on purpose: it always runs and
  # always reports a status, then the two build-and-lint jobs below key off its output
  # with a job-level `if:`. If we path-filtered the trigger instead, a PR touching only
  # backend/ would never even start the frontend job, its required check would sit as
  # "Expected" forever, and the PR could never merge. Skipping the job via `if:` still
  # posts a (skipped) status, which satisfies a required check.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No usable base commit to diff against, treating everything as changed."
            FRONTEND=true
            BACKEND=true
          else
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "Changed files vs ${BASE_SHA}:"
            echo "$CHANGED"
            FRONTEND=false
            BACKEND=false
            echo "$CHANGED" | grep -q '^frontend/' && FRONTEND=true
            echo "$CHANGED" | grep -q '^backend/' && BACKEND=true
          fi
          echo "frontend=${FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"

  build-and-lint-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: GEWIS/actions/.github/workflows/lint-and-build-yarn.yml@v1
    with:
      working-directory: frontend
      node-version: "22.x"
      lint: true
      format: true
      build: true
      test: true
      coverage: true

  build-and-lint-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: GEWIS/actions/.github/workflows/lint-and-build-go.yml@v1
    with:
      working-directory: backend
      go-version: "^1.24.0"
      lint: true
      format: true
      build: true
      test: true
      coverage: true

  # Not path-filtered: it always builds all three images on every PR. That costs a few
  # extra minutes on backend-only or frontend-only changes, but it sidesteps the same
  # skipped-required-check trap entirely for this job (see the comment on `changes` above)
  # without needing a second matching status-check name for a job that sometimes runs and
  # sometimes doesn't.
  #
  # PR-only, not push-to-main: on a push to main, release.yml is about to build (and push)
  # these same three images for real seconds later -- there's no PR left to gate at that
  # point, so building them here too would just be the same work twice.
  dockerize:
    if: github.event_name == 'pull_request'
    uses: GEWIS/actions/.github/workflows/docker-build.yml@v1
    with:
      projects: '["frontend", "frontend/nginx", "backend"]'
      dockerfiles: '["frontend/Dockerfile", "frontend/nginx/Dockerfile", "backend/Dockerfile"]'

  # A reusable-workflow-call job posts its status under two different check names
  # depending on what happens: "build-and-lint-frontend / yarn-steps" if it actually runs,
  # but just "build-and-lint-frontend" (no suffix) if skipped via `if:`. Branch protection
  # matches on the exact string, so neither name alone is safe to require directly -- one
  # of the two would always be missing depending on which paths changed. This job runs
  # unconditionally (`if: always()`, no `uses:`), so it always posts under one stable name,
  # and treats "skipped" (path didn't apply) the same as "success" while still failing on
  # a genuine failure. Require *this* job, not the frontend/backend jobs directly.
  required-checks:
    name: Required checks
    needs:
      - changes
      - build-and-lint-frontend
      - build-and-lint-backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded or were correctly skipped
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed (result: ${{ needs.changes.result }})"
            exit 1
          fi
          for result in "${{ needs.build-and-lint-frontend.result }}" "${{ needs.build-and-lint-backend.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required lint job did not succeed (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs succeeded or were correctly skipped."
